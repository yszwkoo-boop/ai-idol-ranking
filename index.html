support = function(i) {
  oldSupport(i);

  const photo = document.getElementById('photo0');
  const wrap = photo.parentElement;
  let video = document.getElementById('sakuraVideo');

  if (!video) {
    video = document.createElement('video');
    video.id = 'sakuraVideo';
    video.src = 'Sakurayorokobi.MP4';

  photo.style.display = 'none';
  video.style.display = 'block';
  video.currentTime = 0;
  video.play().catch(() => {
    video.style.display = 'none';
    photo.style.display = '';

  });
};
