<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AIアイドル ダンステスト</title>
<style>*{box-sizing:border-box}body{margin:0;background:#110a21;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}.wrap{max-width:450px;margin:auto;padding:14px}h1{font-size:21px;margin:8px 0 14px}.screen{position:relative;width:min(100%,360px);aspect-ratio:512/908;margin:auto;background:#211235;border-radius:14px;overflow:hidden}video{width:100%;height:100%;object-fit:contain;display:block}.status{position:absolute;left:10px;right:10px;top:10px;padding:7px;border-radius:8px;background:#180d28b8;font-size:13px}button{font-size:18px;font-weight:700;padding:14px 20px;border:0;border-radius:14px;background:#ff79b7;color:#29152a;margin:15px 5px 7px}button:disabled{opacity:.5}.count{font-size:17px;margin:8px}small{color:#c5b8d7;display:block;line-height:1.6}</style></head><body><div class="wrap"><h1>🌸 AIアイドル ダンステスト</h1><div class="screen"><video id="idle" src="Idol3Idle30.MP4" autoplay muted playsinline loop preload="auto"></video><video id="dance" src="SakuraDance.mp4" muted playsinline preload="auto" style="display:none"></video><div id="status" class="status">通常待機中</div></div><div class="count">🌸 さくら：<span id="score">0</span> pt</div><button id="gift">🌸 さくらを応援 ＋10</button><button id="sound" style="background:#b5a6e8;font-size:14px">動画を再生</button><small>ボタンで10秒ダンスに切り替わり、終了後に待機動画へ戻ります。<br>ギフト連携ではなく、手動ボタンの動作テストです。</small></div>
<script>
const idle=document.getElementById('idle'),dance=document.getElementById('dance'),status=document.getElementById('status'),gift=document.getElementById('gift'),score=document.getElementById('score');let points=0,busy=false;
async function playIdle(){dance.pause();dance.currentTime=0;dance.style.display='none';idle.pause();idle.currentTime=0;idle.style.display='block';status.textContent='通常待機中（最初から再生）';busy=false;gift.disabled=false;try{await idle.play()}catch(e){status.textContent='「動画を再生」を押してください'}}
async function startDance(){if(busy)return;busy=true;gift.disabled=true;points+=10;score.textContent=points;idle.pause();idle.style.display='none';dance.style.display='block';dance.currentTime=0;status.textContent='🌸 さくら ダンス中！';try{await dance.play()}catch(e){status.textContent='再生に失敗しました。動画を再生を押してください';busy=false;gift.disabled=false}}
dance.addEventListener('ended',playIdle);dance.addEventListener('error',()=>{status.textContent='ダンス動画の読み込みエラー';busy=false;gift.disabled=false});idle.addEventListener('error',()=>{status.textContent='待機動画の読み込みエラー'});gift.addEventListener('click',startDance);document.getElementById('sound').addEventListener('click',()=>busy?dance.play().catch(()=>{}):idle.play().catch(()=>{}));idle.play().catch(()=>{status.textContent='「動画を再生」を押してください'});
</script></body></html>
