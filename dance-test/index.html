<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIアイドル ダンステスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#110a21;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}.wrap{max-width:450px;margin:auto;padding:14px}h1{font-size:21px;margin:8px 0 14px}.screen{position:relative;width:min(100%,360px);aspect-ratio:512/908;margin:auto;background:#211235;border-radius:14px;overflow:hidden}video{width:100%;height:100%;object-fit:contain;display:block}.status{position:absolute;left:10px;right:10px;top:10px;padding:7px;border-radius:8px;background:#180d28b8;font-size:13px}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{font-size:15px;font-weight:700;padding:13px 12px;border:0;border-radius:14px;background:#ff79b7;color:#29152a;margin:12px 0 4px}button.aoi{background:#83c7ff;color:#122641}button.yotsuba{background:#9be5a0;color:#14361b}button:disabled{opacity:.5}.count{font-size:16px;margin:8px}small{color:#c5b8d7;display:block;line-height:1.6;margin-top:8px}
</style></head>
<body><div class="wrap"><h1>🌸💙🍀 AIアイドル ダンステスト</h1>
<div class="screen">
<video id="idle" src="Idol3Idle30.MP4" autoplay muted playsinline loop preload="auto"></video>
<video id="sakuraDance" src="SakuraDance.MP4" muted playsinline preload="auto" style="display:none"></video>
<video id="aoiDance" src="AoiDance.MP4" muted playsinline preload="auto" style="display:none"></video>
<video id="yotsubaDance" src="YotsubaDance.MP4" muted playsinline preload="auto" style="display:none"></video>
<div id="status" class="status">通常待機中</div></div>
<div class="count">🌸 さくら：<span id="sakuraScore">0</span> pt　💙 あおい：<span id="aoiScore">0</span> pt　🍀 よつば：<span id="yotsubaScore">0</span> pt</div>
<div class="buttons"><button id="sakuraGift">🌸 さくらを応援 ＋10</button><button id="aoiGift" class="aoi">💙 あおいを応援 ＋10</button><button id="yotsubaGift" class="yotsuba">🍀 よつばを応援 ＋10</button></div>
<button id="playButton" style="background:#b5a6e8;font-size:14px">動画を再生</button>
<small>応援したアイドルのダンスを再生し、終了後は待機動画の0秒から再生します。手動テスト用です。</small>
</div>
<script>
const idle=document.getElementById('idle');
const dances={sakura:document.getElementById('sakuraDance'),aoi:document.getElementById('aoiDance'),yotsuba:document.getElementById('yotsubaDance')};
const labels={sakura:'🌸 さくら',aoi:'💙 あおい',yotsuba:'🍀 よつば'};
const scores={sakura:0,aoi:0,yotsuba:0};
const buttons={sakura:document.getElementById('sakuraGift'),aoi:document.getElementById('aoiGift'),yotsuba:document.getElementById('yotsubaGift')};
const status=document.getElementById('status');
let active=null;
function disableGifts(disabled){Object.values(buttons).forEach(b=>b.disabled=disabled)}
async function playIdle(){
  Object.values(dances).forEach(v=>{v.pause();v.style.display='none';v.currentTime=0});
  idle.pause();idle.currentTime=0;idle.style.display='block';
  active=null;disableGifts(false);status.textContent='通常待機中（0秒から再生）';
  try{await idle.play()}catch(e){status.textContent='「動画を再生」を押してください'}
}
async function startDance(name){
  if(active)return;
  const video=dances[name];active=name;disableGifts(true);
  scores[name]+=10;document.getElementById(name+'Score').textContent=scores[name];
  idle.pause();idle.style.display='none';
  Object.values(dances).forEach(v=>{v.pause();v.style.display='none'});
  video.currentTime=0;video.style.display='block';status.textContent=labels[name]+' ダンス中！';
  try{await video.play()}catch(e){status.textContent='動画を再生できません。ファイル名を確認してください';await playIdle()}
}
Object.keys(dances).forEach(name=>{
  buttons[name].addEventListener('click',()=>startDance(name));
  dances[name].addEventListener('ended',()=>{if(active===name)playIdle()});
  dances[name].addEventListener('error',()=>{if(active===name){status.textContent='ダンス動画の読み込みエラー';playIdle()}});
});
idle.addEventListener('error',()=>{status.textContent='待機動画の読み込みエラー。ファイル名を確認してください'});
document.getElementById('playButton').addEventListener('click',()=>{
  const video=active?dances[active]:idle;video.play().catch(()=>{status.textContent='動画の再生に失敗しました'});
});
idle.play().catch(()=>{status.textContent='「動画を再生」を押してください'});
</script></body></html>
